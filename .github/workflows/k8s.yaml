on: [push, pull_request]

name: Kubernetes

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kustomize-build:
    name: Kustomize build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - run: go install sigs.k8s.io/kustomize/kustomize/v5@latest
      - run: kustomize build k8s/

  kubeconform:
    name: Schema validation (kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
      - name: Download Flux CRD schemas
        run: |
          mkdir -p /tmp/flux-schemas
          curl -sL https://github.com/fluxcd/flux2/releases/latest/download/crd-schemas.tar.gz \
            | tar xz -C /tmp/flux-schemas
      - name: Validate manifests
        run: |
          find k8s -name '*.yaml' ! -name '*.secret.yaml' | xargs kubeconform \
            -strict \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location '/tmp/flux-schemas/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json'
