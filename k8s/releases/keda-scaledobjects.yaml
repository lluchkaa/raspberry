apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keda-workloads
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: k8s/scaledobjects
  prune: true
  dependsOn:
    - name: flux-system
      namespace: flux-system
