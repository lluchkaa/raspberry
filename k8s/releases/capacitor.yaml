apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capacitor
  namespace: apps
spec:
  interval: 1h
  install:
    createNamespace: true
  chart:
    spec:
      chart: capacitor-next
      sourceRef:
        kind: HelmRepository
        name: capacitor
        namespace: flux-system
      interval: 1h
  values:
    env:
      AZURE_WORKLOAD_IDENTITY_ENABLED: "false"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
