apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartass-subscriber
  namespace: apps
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: smartass-subscriber
  template:
    metadata:
      labels:
        app: smartass-subscriber
    spec:
      containers:
        - name: smartass-subscriber
          image: ghcr.io/lluchkaa/smartass-subscriber:latest
          envFrom:
            - secretRef:
                name: smartass-subscriber
          env:
            - name: STATE_FILE
              value: /data/smartass_state.json
          volumeMounts:
            - name: state
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: smartass-subscriber-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smartass-subscriber-state
  namespace: apps
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: smartass-subscriber
  namespace: apps
spec:
  scaleTargetRef:
    name: smartass-subscriber
  minReplicaCount: 0
  maxReplicaCount: 1
  triggers:
    - type: cron
      metadata:
        timezone: UTC
        start: "30 0 * * 5"
        end: "0 0 * * 6"
        desiredReplicas: "1"
