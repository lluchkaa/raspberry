apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: apps
spec:
  interval: 1h
  install:
    timeout: 15m
    createNamespace: true
  upgrade:
    timeout: 15m
  chart:
    spec:
      chart: pihole
      sourceRef:
        kind: HelmRepository
        name: mojo2600
        namespace: flux-system
      interval: 1h
  values:
    replicaCount: 1

    serviceDns:
      type: LoadBalancer
      loadBalancerIP: "192.168.0.101"

    serviceWeb:
      type: ClusterIP

    persistentVolumeClaim:
      enabled: true
      size: 1Gi

    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

    admin:
      existingSecret: pihole-admin
      passwordKey: password

    DNS1: "1.1.1.1"
    DNS2: "8.8.8.8"

    adlists:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
      - https://raw.githubusercontent.com/PolishFiltersTeam/KADhosts/master/KADhosts.txt
      - https://adaway.org/hosts.txt
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.txt
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/tif.medium.txt
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/fake.txt
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/popupads.txt
      - https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/doh-vpn-proxy-bypass.txt
      - https://big.oisd.nl/
      - https://urlhaus.abuse.ch/downloads/hostfile/
      - https://raw.githubusercontent.com/Perflyst/PiHoleBlocklist/master/SmartTV.txt
      - https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt

    dnsmasq:
      customDnsEntries:
        - address=/raspberry.home/192.168.0.101
      customSettings:
        - rev-server=192.168.0.0/24,192.168.0.1
        - filter-AAAA

    whitelist:
      - clients4.google.com
      - clients2.google.com

    extraEnvVars:
      DNSMASQ_LISTENING: "all"
      DNSSEC: "true"
      QUERY_LOGGING: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pihole-gravity-updater
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pihole-gravity-updater
  namespace: apps
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pihole-gravity-updater
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: pihole-gravity-updater
    namespace: apps
roleRef:
  kind: Role
  name: pihole-gravity-updater
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pihole-gravity-update
  namespace: apps
spec:
  schedule: "0 3 * * 0"  # Every Sunday at 03:00
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: pihole-gravity-updater
          restartPolicy: OnFailure
          containers:
            - name: gravity-update
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  POD=$(kubectl get pod -n apps -l app=pihole -o jsonpath='{.items[0].metadata.name}')
                  kubectl exec -i -n apps "$POD" -- sh -c '
                    while IFS= read -r url; do
                      [ -z "$url" ] && continue
                      pihole-FTL sqlite3 /etc/pihole/gravity.db \
                        "INSERT OR IGNORE INTO adlist (address, enabled) VALUES ('"'"'$url'"'"', 1);"
                    done < /etc/pihole/adlists.list
                  '
                  kubectl exec -n apps "$POD" -- pihole -g
