apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: apps
spec:
  interval: 1h
  install:
    timeout: 15m
    createNamespace: true
  upgrade:
    timeout: 15m
  chart:
    spec:
      chart: pihole
      sourceRef:
        kind: HelmRepository
        name: mojo2600
        namespace: flux-system
      interval: 1h
  values:
    replicaCount: 1

    serviceDns:
      type: LoadBalancer
      loadBalancerIP: "192.168.0.101"

    serviceWeb:
      type: ClusterIP

    persistentVolumeClaim:
      enabled: true
      size: 1Gi

    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

    admin:
      existingSecret: pihole-admin
      passwordKey: password

    DNS1: "1.1.1.1"
    DNS2: "8.8.8.8"

    adlists:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
      - https://raw.githubusercontent.com/PolishFiltersTeam/KADhosts/master/KADhosts.txt
      - https://adaway.org/hosts.txt

    dnsmasq:
      customDnsEntries:
        - address=/raspberry.home/192.168.0.101
      customSettings:
        - rev-server=192.168.0.0/24,192.168.0.1

    whitelist:
      - clients4.google.com
      - clients2.google.com

    extraEnvVars:
      DNSMASQ_LISTENING: "all"
      DNSSEC: "true"
      QUERY_LOGGING: "true"
