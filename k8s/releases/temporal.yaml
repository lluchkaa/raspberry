apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
  namespace: apps
spec:
  interval: 1h
  dependsOn:
    - name: postgresql
      namespace: apps
  chart:
    spec:
      chart: temporal
      sourceRef:
        kind: HelmRepository
        name: temporal
        namespace: flux-system
      interval: 1h
  install:
    timeout: 15m
    createNamespace: true
  upgrade:
    timeout: 15m
  values:
    server:
      replicaCount: 0
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 300m
          memory: 1Gi
      config:
        persistence:
          defaultStore: default
          visibilityStore: visibility
          datastores:
            default:
              sql:
                pluginName: postgres12
                databaseName: temporal
                connectAddr: "postgresql:5432"
                connectProtocol: tcp
                user: temporal
                existingSecret: temporal-db
                secretKey: password
                maxConns: 20
                maxIdleConns: 20
                connMaxLifetime: 1h
            visibility:
              sql:
                pluginName: postgres12
                databaseName: temporal_visibility
                connectAddr: "postgresql:5432"
                connectProtocol: tcp
                user: temporal
                existingSecret: temporal-db
                secretKey: password
                maxConns: 20
                maxIdleConns: 20
                connMaxLifetime: 1h

    admintools:
      enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

    web:
      enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-scaler
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: temporal-scaler
  namespace: apps
rules:
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: temporal-scaler
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: temporal-scaler
    namespace: apps
roleRef:
  kind: Role
  name: temporal-scaler
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: temporal-start
  namespace: apps
spec:
  schedule: "0 0 * * 5"  # midnight UTC Friday
  timeZone: "UTC"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: temporal-scaler
          restartPolicy: OnFailure
          containers:
            - name: scaler
              image: bitnami/kubectl:latest
              command:
                - kubectl
                - patch
                - helmrelease/temporal
                - -n
                - apps
                - --type=merge
                - -p
                - '{"spec":{"values":{"server":{"replicaCount":1},"admintools":{"enabled":true},"web":{"enabled":true}}}}'
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: temporal-stop
  namespace: apps
spec:
  schedule: "0 0 * * 6"  # midnight UTC Saturday
  timeZone: "UTC"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: temporal-scaler
          restartPolicy: OnFailure
          containers:
            - name: scaler
              image: bitnami/kubectl:latest
              command:
                - kubectl
                - patch
                - helmrelease/temporal
                - -n
                - apps
                - --type=merge
                - -p
                - '{"spec":{"values":{"server":{"replicaCount":0},"admintools":{"enabled":false},"web":{"enabled":false}}}}'
