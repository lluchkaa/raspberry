apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      pihole:
        port: 8081
        expose:
          default: true
        exposedPort: 8081
        protocol: TCP
      grafana:
        port: 3000
        expose:
          default: true
        exposedPort: 3000
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole-web
  namespace: pihole
spec:
  entryPoints:
    - pihole
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: pihole-web
          port: 80
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - grafana
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: monitoring-grafana
          port: 80
