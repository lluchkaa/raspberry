apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      pihole:
        port: 8080
        expose:
          default: true
        exposedPort: 8080
        protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pihole-web
  namespace: pihole
spec:
  entryPoints:
    - pihole
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      services:
        - name: pihole-web
          port: 80
